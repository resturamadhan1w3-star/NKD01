<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#09251A" />
      <stop offset="100%" stop-color="#050706" />
    </radialGradient>
    <linearGradient id="neon-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#39FF14" />
      <stop offset="100%" stop-color="#008f11" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bg-glow)" />
  <rect width="510" height="510" x="1" y="1" rx="99" fill="none" stroke="#39FF14" stroke-width="4" stroke-opacity="0.3" />

  <!-- Outer Mystery Compass/Triangle -->
  <polygon points="256,60 450,420 62,420" fill="none" stroke="#39FF14" stroke-width="6" stroke-opacity="0.6" filter="url(#glow)" />
  <circle cx="256" cy="280" r="110" fill="#0A100D" stroke="#39FF14" stroke-width="4" stroke-dasharray="8 6" />

  <!-- The All-Seeing Eye Silhouette -->
  <path d="M 160 280 Q 256 190 352 280 Q 256 370 160 280 Z" fill="#09251A" stroke="#39FF14" stroke-width="8" filter="url(#glow)" />
  <circle cx="256" cy="280" r="42" fill="#39FF14" />
  <circle cx="256" cy="280" r="22" fill="#050706" />
  <circle cx="265" cy="272" r="8" fill="#FFFFFF" />

  <!-- Play Triangle in Pupil -->
  <polygon points="252,274 252,286 262,280" fill="#39FF14" />

  <!-- Tagline Text -->
  <text x="256" y="465" font-family="monospace, sans-serif" font-size="28" font-weight="900" fill="#F5F7F5" text-anchor="middle" letter-spacing="4">NGOBROL DI KANTOR</text>
  <text x="256" y="492" font-family="sans-serif" font-size="14" font-weight="700" fill="#39FF14" text-anchor="middle" letter-spacing="3">THE DARK SIDE</text>
</svg>
